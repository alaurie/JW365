name: Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.0.0 or v1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-native-packages:
    name: Build Native Linux Packages (.deb, .rpm, .tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install packaging dependencies (rpm, dpkg-dev, fakeroot)
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev rpm

      - name: Set up Oracle JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew jw365

      - name: Determine release version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_VER="${{ github.event.inputs.version }}"
          else
            TAG_VER="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG_VER#v}"
          echo "Building release version: $VERSION"
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Run verification suite
        run: ./gradlew clean check -PappVersion=${{ env.APP_VERSION }}

      - name: Build native distribution packages
        run: ./gradlew packageDeb packageRpm packagePortableTar -PappVersion=${{ env.APP_VERSION }}

      - name: List native packages & checksums
        run: |
          ls -lh build/distributions/
          sha256sum build/distributions/*.deb build/distributions/*.rpm build/distributions/*.tar.gz > build/distributions/checksums-native-sha256.txt

      - name: Generate Changelog & Release Notes
        run: |
          chmod +x scripts/generate-changelog.py
          python3 scripts/generate-changelog.py "v${{ env.APP_VERSION }}"

      - name: Create GitHub Release and Upload Native Assets
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          body_path: build/release-notes.md
          files: |
            build/distributions/*.deb
            build/distributions/*.rpm
            build/distributions/*.tar.gz
            build/distributions/checksums-native-sha256.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-flatpak:
    name: Build Flatpak Bundle (.flatpak)
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build Flatpak with official action
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: io.github.alaurie.JW365.yml
          bundle: jw365.flatpak
          branch: master
          cache: true

      - name: Upload Flatpak to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            jw365.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
