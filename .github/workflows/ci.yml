name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Flatpak build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder

      - name: Set up Oracle JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew jw365

      - name: Run test suite
        run: ./gradlew test

      - name: Run check
        run: ./gradlew check
      - name: Validate Flatpak packaging metadata
        run: |
          python3 -m json.tool packaging/flatpak/gradle-sources.json >/dev/null
          flatpak-builder --show-manifest io.github.alaurie.JW365.yml >/dev/null
