name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Oracle GraalVM / JDK 26
        uses: actions/setup-java@v6
        with:
          java-version: '26'
          distribution: 'oracle'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew jw365

      - name: Run test suite
        run: ./gradlew test

      - name: Run check
        run: ./gradlew check
